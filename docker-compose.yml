# AI Interaction Lab - Docker Compose
# Community standard: docker-compose.yml defines full-stack deployment
# Usage: docker compose up -d

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: ai-lab-backend
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_BASE_URL=${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # For production: uncomment and use with nginx-proxy or Caddy
  # frontend:
