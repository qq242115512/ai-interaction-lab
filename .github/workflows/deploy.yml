# ============================================================
# 自动部署工作流（持续部署 / Continuous Deployment）
# 触发：往 main 分支 push src/ 目录下代码时自动运行
# 流程：备份 → 上传 → 装依赖 → 重启 → 健康检查 → 失败自动回滚
# ============================================================

name: 自动部署

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
          # 关键：环境变量让后续 rsync/ssh 自动用密钥
          echo "RSYNC_RSH=ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes" >> $GITHUB_ENV
          echo "SSH_CMD=ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER" >> $GITHUB_ENV
          # 先测试连接
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST "echo 'SSH 连接成功'"

      - name: 创建备份
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST "
            mkdir -p /opt/design-mentor/backups
            BACKUP_FILE=/opt/design-mentor/backups/backup-\$(date +%Y%m%d_%H%M%S).tar.gz
            sudo tar czf \"\$BACKUP_FILE\" -C /opt/design-mentor \
              --exclude='venv' --exclude='backups' --exclude='__pycache__' --exclude='.env' .
            echo \"备份完成: \$BACKUP_FILE\"
          "

      - name: 上传后端
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            --exclude='.env' --exclude='venv/' --exclude='backups/' --exclude='__pycache__/' --exclude='*.pyc' \
            src/backend/ \
            $SSH_USER@$SSH_HOST:/opt/design-mentor/

      - name: 上传前端
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            src/frontend/ \
            $SSH_USER@$SSH_HOST:/var/www/html/

      - name: 上传数据
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST "mkdir -p /opt/design-mentor/data"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            src/backend/data/ \
            $SSH_USER@$SSH_HOST:/opt/design-mentor/data/

      - name: 装依赖
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST "
            sudo /opt/design-mentor/venv/bin/pip install -r /opt/design-mentor/requirements.txt -q
          "

      - name: 重启服务
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST "
            sudo systemctl restart design-mentor
            sleep 3
          "

      - name: 健康检查
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST "
              curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health
            ")
            if [ "$STATUS" = "200" ]; then
              echo "✅ 健康检查通过（第 $i 次）"
              exit 0
            fi
            echo "⏳ 第 $i 次 HTTP $STATUS，等待..."
            sleep 3
          done
          echo "❌ 健康检查失败"
          exit 1

      - name: 清理旧备份
        if: success()
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST "
            ls -t /opt/design-mentor/backups/backup-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r sudo rm -f
          "

      - name: 自动回滚
        if: failure()
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "⚠️ 部署失败，回滚..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -l $SSH_USER $SSH_HOST '
            LATEST=$(ls -t /opt/design-mentor/backups/backup-*.tar.gz 2>/dev/null | head -1)
            if [ -z "$LATEST" ]; then echo "无备份可回滚"; exit 1; fi
            sudo find /opt/design-mentor -mindepth 1 -maxdepth 1 ! -name "venv" ! -name "backups" ! -name ".env" -exec rm -rf {} \;
            sudo tar xzf "$LATEST" -C /opt/design-mentor/
            sudo chown -R deploy:deploy /opt/design-mentor
            sudo systemctl restart design-mentor
            sleep 3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health)
            if [ "$STATUS" != "200" ]; then echo "❌ 回滚失败 HTTP $STATUS"; exit 1; fi
            echo "✅ 回滚成功"
          '
