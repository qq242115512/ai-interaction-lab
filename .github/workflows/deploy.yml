name: 自动部署

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 代码规范检查（Ruff）
        continue-on-error: true
        run: >
          wsl -d Ubuntu -- bash -c
          "pip install ruff -q 2>/dev/null
          && ruff check /mnt/c/Users/qq242/runner/_work/ai-interaction-lab/ai-interaction-lab/src/backend/ --output-format concise
          && echo ✅Ruff通过
          || echo ⚠️Ruff提醒"

      - name: 安全检查（API Key / 私钥泄露）
        continue-on-error: true
        run: >
          wsl -d Ubuntu -- bash -c
          "SRC=/mnt/c/Users/qq242/runner/_work/ai-interaction-lab/ai-interaction-lab/src;
          if grep -rq 'sk-[a-zA-Z0-9]\{20,\}' \$SRC/backend/ --exclude-dir=venv --exclude-dir=__pycache__ --exclude='*.env*' 2>/dev/null; then echo ❌发现API Key硬编码; else echo ✅无API Key泄露; fi;
          if grep -rq 'PRIVATE KEY' \$SRC/ --exclude-dir=.github 2>/dev/null; then echo ❌发现私钥泄露; else echo ✅无私钥泄露; fi"

      - name: 自动化测试（pytest）
        continue-on-error: true
        run: >
          wsl -d Ubuntu -- bash -c
          "pip install pytest httpx -q 2>/dev/null;
          cd /mnt/c/Users/qq242/runner/_work/ai-interaction-lab/ai-interaction-lab/src/backend;
          if find . -name 'test_*.py' | head -1 | grep -q .; then python3 -m pytest . -v --tb=short 2>&1 && echo ✅测试通过 || echo ❌测试失败; else echo ⚠️无测试文件; fi"

      - name: 创建备份
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              mkdir -p /opt/design-mentor/backups
              BACKUP_FILE=/opt/design-mentor/backups/backup-\$(date +%Y%m%d_%H%M%S).tar.gz
              sudo tar czf \"\$BACKUP_FILE\" -C /opt/design-mentor \
                --exclude=venv --exclude=backups --exclude=__pycache__ --exclude=.env .
              echo 备份完成
            '
          "

      - name: 上传后端
        shell: bash
        run: |
          WS_WSL="$(echo '${{ github.workspace }}' | tr '\\' '/' | sed 's|^C:|/mnt/c|')"
          wsl -d Ubuntu -- bash -c "
            rsync -avz --delete \
              -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
              --exclude='.env' --exclude='venv/' --exclude='backups/' --exclude='__pycache__/' --exclude='*.pyc' \
              ${WS_WSL}/src/backend/ \
              deploy@47.103.64.124:/opt/design-mentor/
          "

      - name: 上传前端
        shell: bash
        run: |
          WS_WSL="$(echo '${{ github.workspace }}' | tr '\\' '/' | sed 's|^C:|/mnt/c|')"
          wsl -d Ubuntu -- bash -c "
            rsync -avz --delete \
              -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
              ${WS_WSL}/src/frontend/ \
              deploy@47.103.64.124:/var/www/html/
          "

      - name: 上传数据
        shell: bash
        run: |
          WS_WSL="$(echo '${{ github.workspace }}' | tr '\\' '/' | sed 's|^C:|/mnt/c|')"
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 \
              'mkdir -p /opt/design-mentor/data'
            rsync -avz \
              -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
              ${WS_WSL}/src/backend/data/ \
              deploy@47.103.64.124:/opt/design-mentor/data/
          "

      - name: 装依赖
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              sudo /opt/design-mentor/venv/bin/pip install -r /opt/design-mentor/requirements.txt -q
            '
          "

      - name: 重启服务
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              sudo systemctl restart design-mentor
              sleep 3
            '
          "

      - name: 健康检查
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            for i in 1 2 3 4 5; do
              STATUS=\$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
                curl -s -o /dev/null -w \"%{http_code}\" http://localhost:8080/api/health
              ')
              if [ \"\$STATUS\" = \"200\" ]; then
                echo 健康检查通过
                exit 0
              fi
              sleep 3
            done
            echo 健康检查失败
            exit 1
          "

      - name: 清理旧备份
        if: success()
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              ls -t /opt/design-mentor/backups/backup-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r sudo rm -f
            '
          "

      - name: 自动回滚
        if: failure()
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              LATEST=\$(ls -t /opt/design-mentor/backups/backup-*.tar.gz 2>/dev/null | head -1)
              if [ -z \"\$LATEST\" ]; then echo 无备份; exit 1; fi
              sudo find /opt/design-mentor -mindepth 1 -maxdepth 1 ! -name venv ! -name backups ! -name .env -exec rm -rf {} \;
              sudo tar xzf \"\$LATEST\" -C /opt/design-mentor/
              sudo chown -R deploy:deploy /opt/design-mentor
              sudo systemctl restart design-mentor
              sleep 3
              STATUS=\$(curl -s -o /dev/null -w \"%{http_code}\" http://localhost:8080/api/health)
              if [ \"\$STATUS\" != \"200\" ]; then echo 回滚失败; exit 1; fi
              echo 回滚成功
            '
          "
