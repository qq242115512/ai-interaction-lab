# ============================================================
# 自动部署（自托管 Runner + WSL2）
# Runner 在樊书洋的笔记本上，通过 WSL2 Ubuntu 的 rsync/ssh 部署到阿里云
# 国内网络全链路通畅——不是 GitHub 美国推中国，是本地推阿里云
# ============================================================

name: 自动部署

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════
      # CI（持续集成）：代码检查 → 安全扫描 → 测试
      # 任何一步失败 → 不进入部署 → 不会把坏代码推上线
      # ═══════════════════════════════════════════════════════

      - name: 代码规范检查（Ruff）
        shell: bash
        run: |
          echo "=== 检查 Python 代码规范 ==="
          RUFF_OUT=$(ruff check src/backend/ --output-format concise 2>&1)
          if [ -n "$RUFF_OUT" ]; then
            echo "$RUFF_OUT"
            echo ""
            echo "❌ 代码规范检查未通过"
            exit 1
          fi
          echo "✅ 代码规范检查通过"

      - name: 安全检查（API Key 泄露 + 敏感词）
        shell: bash
        run: |
          echo "=== 检查是否泄露敏感信息 ==="
          FAILED=0
          # 1. API Key 不能出现在代码中
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" src/backend/ --exclude-dir=venv --exclude-dir=__pycache__ --exclude='*.env*' 2>/dev/null; then
            echo "❌ 发现疑似 API Key 硬编码"
            FAILED=1
          fi
          # 2. 服务器密码不能出现在代码中
          if grep -r "@Fsy2006" src/ 2>/dev/null; then
            echo "❌ 发现疑似密码硬编码"
            FAILED=1
          fi
          # 3. 私钥不能出现在代码中
          if grep -r "PRIVATE KEY" src/ --exclude-dir=.github 2>/dev/null; then
            echo "❌ 发现疑似私钥泄露"
            FAILED=1
          fi
          if [ $FAILED -ne 0 ]; then echo "❌ 安全检查未通过"; exit 1; fi
          echo "✅ 安全检查通过"

      - name: 自动化测试（pytest）
        shell: bash
        run: |
          echo "=== 运行 Python 测试 ==="
          if [ -f "src/backend/requirements.txt" ]; then
            pip install -r src/backend/requirements.txt -q 2>/dev/null
          fi
          pip install pytest -q 2>/dev/null
          # 先试试有没有测试文件
          TEST_FILES=$(find src/backend -name "test_*.py" -o -name "*_test.py" 2>/dev/null | head -5)
          if [ -z "$TEST_FILES" ]; then
            echo "⚠️ 没有找到测试文件——跳过测试"
            echo "💡 建议添加至少一个测试用例（test_api_health.py 之类的）"
          else
            python3 -m pytest src/backend/ -v --tb=short 2>&1 || {
              echo "❌ 测试未通过——请修复失败的测试再 push"
              exit 1
            }
            echo "✅ 所有测试通过"
          fi

      # ═══════════════════════════════════════════════════════
      # CD（持续部署）：备份 → 上传 → 重启 → 健康检查
      # 只有 CI 全部通过才会走到这里
      # ═══════════════════════════════════════════════════════
      # github.workspace = C:\Users\qq242\runner\_work\ai-interaction-lab\ai-interaction-lab
      # WSL 路径 = /mnt/c/Users/qq242/runner/_work/ai-interaction-lab/ai-interaction-lab

      - name: 创建备份
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              mkdir -p /opt/design-mentor/backups
              BACKUP_FILE=/opt/design-mentor/backups/backup-\$(date +%Y%m%d_%H%M%S).tar.gz
              sudo tar czf \"\$BACKUP_FILE\" -C /opt/design-mentor \
                --exclude=venv --exclude=backups --exclude=__pycache__ --exclude=.env .
              echo 备份完成
            '
          "

      - name: 上传后端
        shell: bash
        run: |
          WS_WSL="$(echo '${{ github.workspace }}' | tr '\\' '/' | sed 's|^C:|/mnt/c|')"
          wsl -d Ubuntu -- bash -c "
            rsync -avz --delete \
              -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
              --exclude='.env' --exclude='venv/' --exclude='backups/' --exclude='__pycache__/' --exclude='*.pyc' \
              ${WS_WSL}/src/backend/ \
              deploy@47.103.64.124:/opt/design-mentor/
          "

      - name: 上传前端
        shell: bash
        run: |
          WS_WSL="$(echo '${{ github.workspace }}' | tr '\\' '/' | sed 's|^C:|/mnt/c|')"
          wsl -d Ubuntu -- bash -c "
            rsync -avz --delete \
              -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
              ${WS_WSL}/src/frontend/ \
              deploy@47.103.64.124:/var/www/html/
          "

      - name: 上传数据
        shell: bash
        run: |
          WS_WSL="$(echo '${{ github.workspace }}' | tr '\\' '/' | sed 's|^C:|/mnt/c|')"
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 \
              'mkdir -p /opt/design-mentor/data'
            rsync -avz \
              -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
              ${WS_WSL}/src/backend/data/ \
              deploy@47.103.64.124:/opt/design-mentor/data/
          "

      - name: 装依赖
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              sudo /opt/design-mentor/venv/bin/pip install -r /opt/design-mentor/requirements.txt -q
            '
          "

      - name: 重启服务
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              sudo systemctl restart design-mentor
              sleep 3
            '
          "

      - name: 健康检查
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            for i in 1 2 3 4 5; do
              STATUS=\$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
                curl -s -o /dev/null -w \"%{http_code}\" http://localhost:8080/api/health
              ')
              if [ \"\$STATUS\" = \"200\" ]; then
                echo \"✅ 第 \$i 次 HTTP \$STATUS\"
                exit 0
              fi
              echo \"⏳ 第 \$i 次 HTTP \$STATUS\"
              sleep 3
            done
            echo \"❌ 健康检查失败\"
            exit 1
          "

      - name: 清理旧备份
        if: success()
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              ls -t /opt/design-mentor/backups/backup-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r sudo rm -f
            '
          "

      - name: 自动回滚
        if: failure()
        shell: bash
        run: |
          wsl -d Ubuntu -- bash -c "
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy@47.103.64.124 '
              LATEST=\$(ls -t /opt/design-mentor/backups/backup-*.tar.gz 2>/dev/null | head -1)
              if [ -z \"\$LATEST\" ]; then echo 无备份可回滚; exit 1; fi
              sudo find /opt/design-mentor -mindepth 1 -maxdepth 1 ! -name venv ! -name backups ! -name .env -exec rm -rf {} \;
              sudo tar xzf \"\$LATEST\" -C /opt/design-mentor/
              sudo chown -R deploy:deploy /opt/design-mentor
              sudo systemctl restart design-mentor
              sleep 3
              STATUS=\$(curl -s -o /dev/null -w \"%{http_code}\" http://localhost:8080/api/health)
              if [ \"\$STATUS\" != \"200\" ]; then echo 回滚失败; exit 1; fi
              echo 回滚成功
            '
          "
